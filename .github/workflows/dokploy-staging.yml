name: Dokploy Staging (Reusable)

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: number
      dokploy_api_url:
        required: true
        type: string
      branch:
        required: false
        type: string
      frontend_branch:
        required: false
        type: string
      backend_branch:
        required: false
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      dokploy_token:
        required: true

jobs:
  dokploy-staging:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Deploy staging
        if: ${{ github.event.action != 'closed' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Deploying staging for PR #${PR_NUMBER}"

          BODY_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -X POST "${{ inputs.dokploy_api_url }}/api/deploy" \
          -H "Authorization: Bearer ${{ secrets.dokploy_token }}" \
          -H "Content-Type: application/json" \
          -o "$BODY_FILE" \
          -w "%{http_code}" \
          -d @- <<EOF
          {
            "project_id": ${{ inputs.project_id }},
            "pr_number": "${PR_NUMBER}",
            "branch": "${{ inputs.branch != '' && inputs.branch || env.BRANCH_NAME }}",
            "frontend_branch": "${{ inputs.frontend_branch }}",
            "backend_branch": "${{ inputs.backend_branch }}"
          }
          EOF
          )"

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Response body:"
            cat "$BODY_FILE"
            exit 1
          fi

      - name: Remove staging
        if: ${{ github.event.action == 'closed' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "Removing staging for PR #${PR_NUMBER}"

          BODY_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -X DELETE "${{ inputs.dokploy_api_url }}/api/remove" \
            -H "Authorization: Bearer ${{ secrets.dokploy_token }}" \
            -H "Content-Type: application/json" \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -d "{
              \"project_id\": ${{ inputs.project_id }},
              \"pr_number\": \"${PR_NUMBER}\"
            }")"

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Response body:"
            cat "$BODY_FILE"
            exit 1
          fi
