services:
  server:
    image: ghcr.io/backtik-ch/dokploy-staging:main
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-staging-network
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    image: ghcr.io/backtik-ch/dokploy-staging:main
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-staging-network
    env_file:
      - .env
    restart: unless-stopped
    entrypoint: ["/docker/entrypoint-scheduler.sh"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "php artisan list --no-ansi >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: mariadb:11
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - dokploy-staging-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u $MARIADB_USER --password=$MARIADB_PASSWORD -e 'SELECT 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  dokploy-staging-network:
    driver: bridge
